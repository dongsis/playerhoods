name: Codex Implement

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to implement"
        required: true
        type: number

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

jobs:
  guard:
    name: Guard implementation trigger
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.guard.outputs.should_run }}
      issue_number: ${{ steps.guard.outputs.issue_number }}
      issue_title: ${{ steps.guard.outputs.issue_title }}
      branch_name: ${{ steps.guard.outputs.branch_name }}
    steps:
      - name: Validate trigger, actor, and labels
        id: guard
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            let issueNumber = null;
            let actor = context.actor;
            let shouldRun = false;

            if (context.eventName === "workflow_dispatch") {
              issueNumber = Number(context.payload.inputs.issue_number);
              shouldRun = true;
            } else {
              const comment = context.payload.comment;
              const issue = context.payload.issue;

              if (!comment || !issue || issue.pull_request) {
                core.setOutput("should_run", "false");
                return;
              }

              const body = (comment.body || "").trim();
              if (!body.startsWith("/approve-plan")) {
                core.setOutput("should_run", "false");
                return;
              }

              issueNumber = issue.number;
              shouldRun = true;
            }

            const perm = await github.rest.repos.getCollaboratorPermissionLevel({
              owner,
              repo,
              username: actor
            });

            const allowed = ["admin", "write", "maintain"].includes(perm.data.permission);
            if (!allowed) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issueNumber,
                body: `⚠️ /approve-plan ignored because @${actor} does not have write/maintain/admin permission.`
              });
              core.setOutput("should_run", "false");
              return;
            }

            const issueResp = await github.rest.issues.get({
              owner,
              repo,
              issue_number: issueNumber
            });

            const issue = issueResp.data;
            const labels = issue.labels.map(l => l.name);

            const hardBlockLabels = [
              "blocked",
              "conflict-risk",
              "needs-sequencing",
              "high-risk",
              "production-validation",
              "notification-flow",
              "email-delivery",
              "external-service-required",
              "do-not-automerge"
            ];

            const foundBlocks = hardBlockLabels.filter(l => labels.includes(l));

            if (foundBlocks.length > 0 && !labels.includes("autopilot-safe")) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issueNumber,
                body: `⚠️ Implementation blocked by labels: ${foundBlocks.map(x => `\`${x}\``).join(", ")}.

                Add \`autopilot-safe\` only if you explicitly want Codex to implement despite these labels.`
              });
              core.setOutput("should_run", "false");
              return;
            }

            const slug = issue.title
              .toLowerCase()
              .replace(/[^a-z0-9]+/g, "-")
              .replace(/^-|-$/g, "")
              .slice(0, 48);

            const branchName = `codex/issue-${issueNumber}-${slug}`;

            core.setOutput("should_run", String(shouldRun));
            core.setOutput("issue_number", String(issueNumber));
            core.setOutput("issue_title", issue.title);
            core.setOutput("branch_name", branchName);

  implement:
    name: Implement with Codex
    needs: guard
    if: needs.guard.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    outputs:
      final_message: ${{ steps.run_codex.outputs.final-message }}
      pr_url: ${{ steps.create_pr.outputs.pr_url }}

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v5
        with:
          ref: main
          token: ${{ github.token }}

      - name: Create work branch
        env:
          BRANCH_NAME: ${{ needs.guard.outputs.branch_name }}
        run: |
          git checkout -b "$BRANCH_NAME"

      - name: Collect issue context
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ needs.guard.outputs.issue_number }}
        run: |
          gh issue view "$ISSUE_NUMBER" \
            --json number,title,body,labels,comments,url,author,state \
            > issue-context.json

      - name: Build implementation prompt
        env:
          ISSUE_NUMBER: ${{ needs.guard.outputs.issue_number }}
        run: |
          mkdir -p .github/codex/runtime-prompts

          cat > .github/codex/runtime-prompts/implement.md <<'EOF'
          You are Codex implementing a PlayerHoods issue.

          Read issue-context.json and repository instructions.

          Implement the smallest safe change.

          Hard rules:
          - One issue only.
          - Keep scope tight.
          - Do not deploy.
          - Do not apply migrations.
          - Do not modify DB schema or SQL unless the issue explicitly requires it and migration governance is completed.
          - Do not send real SMS/email.
          - Do not change notification delivery unless issue explicitly says so.
          - Do not touch processDeliveriesAction unless issue explicitly says so.
          - Preserve existing shipped behavior.
          - If the issue involves match participant lifecycle:
            - confirmed iff participant_accepted_at and org_approved_at are both present
            - status is derived
            - removed truth is removed_at
          - If you discover the issue needs a broader fix than planned, stop and write a note instead of expanding scope.

          After changes:
          - Leave a concise summary.
          - Include files changed.
          - Include tests run or why not run.
          - Include risk and caveats.
          EOF

      - name: Run Codex implementation
        id: run_codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/codex/runtime-prompts/implement.md
          output-file: codex-implement.md
          sandbox: workspace-write
          safety-strategy: drop-sudo
          codex-args: '["--ephemeral"]'

      - name: Check for changes
        id: changes
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run build and typecheck
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          npm ci
          npm run build
          npx tsc --noEmit

      - name: Commit changes
        if: steps.changes.outputs.has_changes == 'true'
        env:
          ISSUE_NUMBER: ${{ needs.guard.outputs.issue_number }}
          ISSUE_TITLE: ${{ needs.guard.outputs.issue_title }}
        run: |
          git config user.name "playerhoods-codex-bot"
          git config user.email "actions@github.com"

          git add .
          git commit -m "Fix #$ISSUE_NUMBER: $ISSUE_TITLE"

      - name: Push branch
        if: steps.changes.outputs.has_changes == 'true'
        env:
          BRANCH_NAME: ${{ needs.guard.outputs.branch_name }}
        run: |
          git push origin "$BRANCH_NAME"

      - name: Create PR
        if: steps.changes.outputs.has_changes == 'true'
        id: create_pr
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_NAME: ${{ needs.guard.outputs.branch_name }}
          ISSUE_NUMBER: ${{ needs.guard.outputs.issue_number }}
          ISSUE_TITLE: ${{ needs.guard.outputs.issue_title }}
          CODEX_SUMMARY: ${{ steps.run_codex.outputs.final-message }}
        run: |
          cat > pr-body.md <<EOF
          Closes #$ISSUE_NUMBER

          ## Summary

          Automated Codex implementation for #$ISSUE_NUMBER: $ISSUE_TITLE

          ## Codex Report

          $CODEX_SUMMARY

          ## Safety

          - No manual deploy was performed.
          - GitHub Actions checks must pass before merge.
          - PR Conflict Scan must pass before merge.
          - Owner approval is required unless this PR is later marked autopilot-safe and autopilot-merge-ok.
          EOF

          PR_URL=$(gh pr create \
            --base main \
            --head "$BRANCH_NAME" \
            --title "Fix #$ISSUE_NUMBER: $ISSUE_TITLE" \
            --body-file pr-body.md)

          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: Comment no changes
        if: steps.changes.outputs.has_changes != 'true'
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ needs.guard.outputs.issue_number }}
          CODEX_SUMMARY: ${{ steps.run_codex.outputs.final-message }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.ISSUE_NUMBER),
              body: `Codex implementation produced no file changes.

              ${process.env.CODEX_SUMMARY || ""}`
            });

  post_result:
    name: Post implementation result
    needs: [guard, implement]
    if: needs.guard.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Comment result
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ needs.guard.outputs.issue_number }}
          PR_URL: ${{ needs.implement.outputs.pr_url }}
          CODEX_SUMMARY: ${{ needs.implement.outputs.final_message }}
        with:
          script: |
            const body = `## Codex Implementation Result

            PR: ${process.env.PR_URL || "No PR created"}

            ${process.env.CODEX_SUMMARY || ""}

            Next:
            - Review PR checks.
            - Review PR Conflict Scan.
            - Run Codex PR review if needed.
            - Do not merge until approved.`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.ISSUE_NUMBER),
              body
            });
