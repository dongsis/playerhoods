name: Safe Auto Merge

on:
  issue_comment:
    types: [created]
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to merge"
        required: true
        type: number
      issue_number:
        description: "Linked issue number, optional"
        required: false
        type: number

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write
  checks: read

jobs:
  guard:
    name: Guard merge
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.guard.outputs.should_run }}
      pr_number: ${{ steps.guard.outputs.pr_number }}
      issue_number: ${{ steps.guard.outputs.issue_number }}
    steps:
      - name: Validate trigger and actor
        id: guard
        uses: actions/github-script@v7
        with:
          script: |
            let prNumber = null;
            let issueNumber = "";

            if (context.eventName === "workflow_dispatch") {
              prNumber = Number(context.payload.inputs.pr_number);
              issueNumber = context.payload.inputs.issue_number || "";
            }

            if (context.eventName === "issue_comment") {
              const issue = context.payload.issue;
              const comment = context.payload.comment;

              if (!issue || !issue.pull_request || !comment) {
                core.setOutput("should_run", "false");
                return;
              }

              const body = (comment.body || "").trim();
              if (!body.startsWith("/approve-merge")) {
                core.setOutput("should_run", "false");
                return;
              }

              const match = body.match(/issue=(\d+)/);
              if (match) issueNumber = match[1];

              prNumber = issue.number;
            }

            if (context.eventName === "pull_request") {
              const label = context.payload.label?.name;
              if (label !== "autopilot-merge-ok") {
                core.setOutput("should_run", "false");
                return;
              }
              prNumber = context.payload.pull_request.number;
            }

            if (!prNumber) {
              core.setOutput("should_run", "false");
              return;
            }

            const perm = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: context.actor
            });

            const allowed = ["admin", "write", "maintain"].includes(perm.data.permission);
            if (!allowed) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: `⚠️ Merge ignored because @${context.actor} lacks write/maintain/admin permission.`
              });
              core.setOutput("should_run", "false");
              return;
            }

            core.setOutput("should_run", "true");
            core.setOutput("pr_number", String(prNumber));
            core.setOutput("issue_number", String(issueNumber));

  inspect:
    name: Inspect PR safety
    needs: guard
    if: needs.guard.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: write
      checks: read

    outputs:
      safe: ${{ steps.inspect.outputs.safe }}
      head_sha: ${{ steps.inspect.outputs.head_sha }}
      reason: ${{ steps.inspect.outputs.reason }}

    steps:
      - name: Inspect labels, files, checks
        id: inspect
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.guard.outputs.pr_number }}
        run: |
          set -e

          gh pr view "$PR_NUMBER" \
            --json number,title,labels,mergeable,isDraft,headRefOid,baseRefName,url \
            > pr.json

          jq -r '.headRefOid' pr.json > head_sha.txt
          echo "head_sha=$(cat head_sha.txt)" >> "$GITHUB_OUTPUT"

          LABELS=$(jq -r '.labels[].name' pr.json | tr '\n' ' ')

          BLOCK_LABELS="do-not-automerge high-risk production-validation notification-flow email-delivery external-service-required blocked conflict-risk needs-sequencing"
          for label in $BLOCK_LABELS; do
            if echo "$LABELS" | grep -qw "$label"; then
              echo "safe=false" >> "$GITHUB_OUTPUT"
              echo "reason=Blocked by label: $label" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

          gh pr diff "$PR_NUMBER" --name-only > files.txt

          echo "Changed files:"
          cat files.txt

          DANGEROUS_PATTERNS='^supabase/|\.sql$|^src/lib/notifications|^src/app/api/sms|^src/app/api/auth|^src/middleware\.ts$|^docs/00_RELEASE_GOVERNANCE|^docs/00_PRODUCTION_CHANGE_LOG|^\.github/workflows/production'

          if grep -E "$DANGEROUS_PATTERNS" files.txt; then
            echo "safe=false" >> "$GITHUB_OUTPUT"
            echo "reason=Blocked by dangerous/high-risk file pattern" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Wait for required checks to finish.
          gh pr checks "$PR_NUMBER" --watch --fail-fast

          echo "safe=true" >> "$GITHUB_OUTPUT"
          echo "reason=PR passed safe-automerge inspection" >> "$GITHUB_OUTPUT"

      - name: Comment if blocked
        if: steps.inspect.outputs.safe != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.guard.outputs.pr_number }}
          REASON: ${{ steps.inspect.outputs.reason }}
        run: |
          gh pr comment "$PR_NUMBER" --body "⚠️ Safe Auto Merge blocked.

          Reason: $REASON

          This PR requires owner/manual decision."

  merge:
    name: Squash merge PR
    needs: [guard, inspect]
    if: needs.inspect.outputs.safe == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write

    outputs:
      merge_sha: ${{ steps.merge.outputs.merge_sha }}

    steps:
      - name: Merge PR
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.guard.outputs.pr_number }}
        run: |
          gh pr merge "$PR_NUMBER" --squash --delete-branch --auto=false

          # Wait briefly for main to update.
          sleep 10

          MERGE_SHA=$(gh pr view "$PR_NUMBER" --json mergeCommit --jq '.mergeCommit.oid')
          echo "merge_sha=$MERGE_SHA" >> "$GITHUB_OUTPUT"

      - name: Comment merge result
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.guard.outputs.pr_number }}
          MERGE_SHA: ${{ steps.merge.outputs.merge_sha }}
        run: |
          gh pr comment "$PR_NUMBER" --body "✅ PR #$PR_NUMBER was squash-merged.

          Merge commit: \`$MERGE_SHA\`

          Normal production deployment may be triggered by Vercel if main is connected to production.
          Production smoke will be requested next."

  trigger_smoke:
    name: Trigger production smoke
    needs: [guard, inspect, merge]
    if: needs.inspect.outputs.safe == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read

    steps:
      - name: Trigger production-smoke workflow
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.guard.outputs.pr_number }}
          ISSUE_NUMBER: ${{ needs.guard.outputs.issue_number }}
          MERGE_SHA: ${{ needs.merge.outputs.merge_sha }}
        run: |
          gh workflow run production-smoke.yml \
            -f pr_number="$PR_NUMBER" \
            -f issue_number="$ISSUE_NUMBER" \
            -f commit_sha="$MERGE_SHA" \
            -f smoke_type="light"
