name: AI Plan

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to plan"
        required: true
        type: number

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  guard:
    name: Guard trigger
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.guard.outputs.should_run }}
      issue_number: ${{ steps.guard.outputs.issue_number }}
    steps:
      - name: Validate trigger and trusted actor
        id: guard
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            let issueNumber = null;
            let actor = context.actor;
            let shouldRun = false;

            if (context.eventName === "workflow_dispatch") {
              issueNumber = Number(context.payload.inputs.issue_number);
              shouldRun = true;
            } else {
              const comment = context.payload.comment;
              const issue = context.payload.issue;

              if (!comment || !issue) {
                core.setOutput("should_run", "false");
                return;
              }

              if (issue.pull_request) {
                core.info("This is a PR comment, not an issue comment. Skipping.");
                core.setOutput("should_run", "false");
                return;
              }

              const body = (comment.body || "").trim();
              if (!body.startsWith("/codex plan")) {
                core.info("Comment does not start with /codex plan. Skipping.");
                core.setOutput("should_run", "false");
                return;
              }

              issueNumber = issue.number;
              shouldRun = true;
            }

            try {
              const perm = await github.rest.repos.getCollaboratorPermissionLevel({
                owner,
                repo,
                username: actor
              });

              const allowed = ["admin", "write", "maintain"].includes(perm.data.permission);
              if (!allowed) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  body: `⚠️ /codex plan ignored because @${actor} does not have write/maintain/admin permission.`
                });
                core.setOutput("should_run", "false");
                return;
              }
            } catch (error) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issueNumber,
                body: `⚠️ /codex plan could not verify @${actor}'s permission: ${error.message}`
              });
              core.setOutput("should_run", "false");
              return;
            }

            core.setOutput("should_run", String(shouldRun));
            core.setOutput("issue_number", String(issueNumber));

  plan:
    name: Generate Codex plan
    needs: guard
    if: needs.guard.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read

    outputs:
      final_message: ${{ steps.run_codex.outputs.final-message }}

    steps:
      - name: Checkout default branch
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Collect issue context
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ needs.guard.outputs.issue_number }}
        run: |
          set -euo pipefail

          gh issue view "$ISSUE_NUMBER" \
            --json number,title,body,labels,comments,url,author,state,closed,closedAt,updatedAt \
            > issue-context.json

          jq '
            .comments
            | sort_by(.createdAt)
            | reverse
            | .[0:15]
          ' issue-context.json > latest-comments.json

          gh pr list --state open --limit 100 \
            --json number,title,state,isDraft,baseRefName,headRefName,labels,mergeable,url,updatedAt \
            > open-prs.json

          gh pr list --state all --limit 30 \
            --search "#${ISSUE_NUMBER} repo:${GITHUB_REPOSITORY}" \
            --json number,title,state,isDraft,baseRefName,headRefName,labels,mergeable,mergedAt,url,updatedAt \
            > linked-prs.json

          jq -r '
            [
              .title,
              (.body // ""),
              (.comments[]?.body // "")
            ]
            | join("\n")
            | scan("#[0-9]+")
            | ltrimstr("#")
          ' issue-context.json \
            | sort -nu \
            | grep -v "^${ISSUE_NUMBER}$" \
            > referenced-issue-numbers.txt || true

          echo "[]" > referenced-issues.json
          if [ -s referenced-issue-numbers.txt ]; then
            while read -r referenced_issue; do
              [ -n "$referenced_issue" ] || continue
              if gh issue view "$referenced_issue" \
                --json number,title,state,labels,url,closed,closedAt,updatedAt \
                > "referenced-issue-${referenced_issue}.json"; then
                jq -s '.[0] + [.[1]]' referenced-issues.json "referenced-issue-${referenced_issue}.json" \
                  > referenced-issues.tmp
                mv referenced-issues.tmp referenced-issues.json
              fi
            done < referenced-issue-numbers.txt
          fi

          cat > context-inventory.md <<EOF
          # AI Plan Context Inventory

          Target issue: #${ISSUE_NUMBER}

          Files collected:
          - issue-context.json: full target issue JSON, including comments.
          - latest-comments.json: 15 newest target issue comments.
          - open-prs.json: current open PR list at plan time.
          - linked-prs.json: PRs detectable by GitHub search for #${ISSUE_NUMBER}.
          - referenced-issues.json: current labels/status for issue references mentioned in title/body/comments.

          Planning rule:
          Treat older comments as historical unless confirmed by current labels, current issue state, open-prs.json, linked-prs.json, or referenced-issues.json.
          EOF

          echo "Issue context collected:"
          cat issue-context.json | head -c 2000 || true
          echo
          echo "Open PR count:"
          jq 'length' open-prs.json
          echo "Linked PR count:"
          jq 'length' linked-prs.json
          echo "Referenced issues:"
          cat referenced-issue-numbers.txt || true

      - name: Build Codex planning prompt
        env:
          ISSUE_NUMBER: ${{ needs.guard.outputs.issue_number }}
        run: |
          mkdir -p .github/codex/runtime-prompts

          cat > .github/codex/runtime-prompts/ai-plan.md <<'EOF'
          You are the PlayerHoods Issue Coordinator.

          Your job is to produce an implementation plan only. Do not modify files.

          Read:
          - issue-context.json
          - latest-comments.json
          - open-prs.json
          - linked-prs.json
          - referenced-issues.json
          - context-inventory.md
          - AGENTS.md if present
          - docs/00_RELEASE_GOVERNANCE.md if present
          - docs/00_PRODUCTION_CHANGE_LOG.md if present
          - related code paths as needed

          Context freshness rules:
          - Treat the target issue JSON as the source of truth for the target issue.
          - Treat open-prs.json as the source of truth for currently open PR blockers.
          - Treat linked-prs.json as detectable PR history/current linkage, not proof of current blockage unless the PR is open.
          - Treat referenced-issues.json as the source of truth for current status/labels of issues mentioned in comments.
          - Treat older comments as historical unless they are confirmed by current labels, current issue state, open-prs.json, linked-prs.json, or referenced-issues.json.
          - Do not repeat stale blocker claims from comments when the referenced issue is closed/shipped or the referenced PR is merged/closed.
          - If comments mention blockers such as #6, #11, #36, #5, or PR #39, verify their current state from referenced-issues.json, linked-prs.json, and open-prs.json before calling the issue blocked.

          Required output:

          ## Codex Plan

          ### Issue Summary
          - Issue:
          - User impact:
          - Affected user flow:

          ### Classification
          Choose one:
          - UI polish
          - UX flow
          - state consistency
          - bug fix
          - production validation
          - workflow/process
          - DB/migration
          - notification/email/SMS
          - release promotion

          ### Risk Level
          Low / Medium / High

          ### Conflict Scan
          - likely files touched
          - high-conflict files touched
          - related open PRs if visible from context
          - should this be blocked?

          ### Implementation Plan
          Numbered steps.

          ### Out of Scope
          Explicitly list what must not be changed.

          ### Acceptance Criteria
          Bullet list.

          ### Test Plan
          Include build/typecheck, preview, production smoke if needed.

          ### Owner Decision Needed?
          Say one:
          - No, safe to implement after approval
          - Yes, decision needed

          If high risk, DB/migration, notification/SMS/email, auth/permissions, release promotion, or production config is involved, recommend adding:
          - needs-owner-decision
          - do-not-automerge

          Important PlayerHoods rules:
          - Do not conflate GitHub commit, Vercel Production, Supabase Remote, and production verification.
          - Do not change DB or migrations without explicit migration governance.
          - For match participant lifecycle, confirmed means participant_accepted_at and org_approved_at are both present.
          - Status is derived; removed truth is removed_at.
          - Do not send real SMS/email during validation.
          EOF

      - name: Run Codex plan
        id: run_codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/codex/runtime-prompts/ai-plan.md
          output-file: codex-plan.md
          sandbox: read-only
          safety-strategy: drop-sudo
          codex-args: '["--ephemeral"]'

  post_plan:
    name: Post plan to issue
    needs: [guard, plan]
    if: needs.guard.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - name: Post Codex plan comment
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ needs.guard.outputs.issue_number }}
          CODEX_PLAN: ${{ needs.plan.outputs.final_message }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = Number(process.env.ISSUE_NUMBER);
            const plan = process.env.CODEX_PLAN || "Codex produced no plan output.";

            const body = `## AI Plan Result

            ${plan}

            ---

            Next owner action:
            - Comment \`/approve-plan\` to let Codex implement if this plan is acceptable.
            - Add \`do-not-automerge\` or \`needs-owner-decision\` if you want implementation to stop before merge.`;

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number,
              body
            });

            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number,
              labels: ["plan-ready", "autopilot-plan"]
            });
