name: SQL Regression Check

on:
  pull_request:
    branches:
      - main
      - release/**
      - release/integration-*
    paths:
      - .github/workflows/sql-regression.yml
      - package.json
      - package-lock.json
      - scripts/run-sql-regressions.mjs
      - supabase/**
      - tests/test_runner_*.sql
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sql-regression:
    name: SQL regression
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest
          github-token: ${{ github.token }}

      - name: Start clean local Supabase database
        run: supabase db start

      - name: Reset local database with migrations and seed data
        run: supabase db reset

      - name: Run SQL regressions
        run: npm run verify:sql

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
