name: SMS RSVP Issue Triage

on:
  issues:
    types: [opened, labeled]

permissions:
  issues: write
  contents: read

jobs:
  triage:
    name: Add SMS RSVP bug checklist
    if: contains(github.event.issue.labels.*.name, 'sms') && contains(github.event.issue.labels.*.name, 'bug')
    runs-on: ubuntu-latest

    steps:
      - name: Add checklist comment
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- playerhoods-sms-rsvp-triage -->';
            const body = `${marker}
            ### SMS RSVP Bug Checklist

            Please verify this issue includes:

            - [ ] Affected match/contact/phone ending, if safe to share
            - [ ] Number of SMS messages received
            - [ ] Codes received
            - [ ] Whether YES / NO / OUT / link was used
            - [ ] Inbox notifications observed
            - [ ] Whether Contact Player invite, host-managed confirmation, or Game On was involved
            - [ ] Expected behavior

            Required fix scope:

            - [ ] one active participant/invite -> one RSVP code
            - [ ] YES / NO / OUT / DETAILS use the same code
            - [ ] one participant -> one invitation anchor
            - [ ] no duplicate Contact Player invite SMS
            - [ ] SQL regression added
            - [ ] no real SMS provider calls in automated tests
            `;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });

            const existing = comments.find(comment =>
              comment.user.type === 'Bot' && comment.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
